plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bhavb13.dtm'
    compileSdk 35

    defaultConfig {
        applicationId "com.bhavb13.dtm"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = false
    }
}

dependencies {
    // No runtime dependencies on purpose: framework classes only.
    testImplementation 'junit:junit:4.13.2'
}
